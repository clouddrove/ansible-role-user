---

- name: Add users | create users, shell, home dirs
  ansible.builtin.user:
    name: "{{ item.username }}"
    shell: "/bin/bash"
    createhome: true
    comment: 'created with ansible'
  with_items: '{{ users }}'

- name: Modify .ssh permissions
  ansible.builtin.file:
    path: '/home/{{ item.username }}/.ssh'
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: 0700
  with_items: '{{ users }}'

- name: Setup | authorized key upload
  ansible.posix.authorized_key:
    user: "{{ item.username }}"
    key: "{{ lookup('file', './../../_ssh/'+Env+'/'+item.username+'.pub') }}"
    path: '/home/{{ item.username }}/.ssh/authorized_keys'
    manage_dir: false
  with_items: '{{ users }}'

- name: Transfer ssh config /etc/ssh/ssh_config
  ansible.builtin.copy:
    src: templates/keys/ssh_config
    dest: /home/{{ item.username }}/.ssh/config
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: 0600
  with_items: '{{ users }}'

- name: Sudoers | update sudoers file and validate
  ansible.builtin.lineinfile:
    dest: "/etc/sudoers"
    insertafter: EOF
    line: '{{ item.username }} ALL=(ALL) NOPASSWD: ALL'
    regexp: '^{{ item.username }} .*'
    state: present
  when: item.use_sudo
  with_items: '{{ users }}'

- name: Delete user | remove user
  ansible.builtin.user:
    name: "{{ item.username }}"
    state: absent
    remove: true
  failed_when: "'NOTHING' in command_result.stderr"
  when: rm_user_flag
  with_items: '{{ rm_users }}'
